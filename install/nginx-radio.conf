# Reverse proxy pour l'interface d'administration.
# A adapter (nom de domaine / IP locale) puis copier dans
# /etc/nginx/sites-available/radio puis :
#   ln -s /etc/nginx/sites-available/radio /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Comme pour BL-FMO, on peut ensuite ajouter du HTTPS avec certbot si le
# serveur est joignable depuis un nom de domaine, ou rester en HTTP simple
# sur le reseau local (mDNS type radio.local).

server {
    listen 80;
    server_name radio.local;

    client_max_body_size 150M;  # doit couvrir MAX_UPLOAD_MB de config.py

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Le flux SSE (/api/now-playing/stream) a besoin de ne pas etre bufferise
    location ~ ^/api/(public/)?now-playing/stream$ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}
