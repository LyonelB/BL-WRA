{% extends "base.html" %}
{% block title %}Modifier — {{ cfg.label }}{% endblock %}
{% block content %}

<div class="page-header">
  <h1>Modifier</h1>
</div>

<section class="card" style="max-width: 420px;">
  <p class="hint">Fichier : {{ track.filename }}{% if track.duration %} · {{ track.duration | duree }}{% endif %}</p>
  <form method="post" class="settings-form">
    <label>Titre
      <input type="text" name="title" value="{{ track.title or '' }}">
    </label>
    <label>Artiste
      <input type="text" name="artist" value="{{ track.artist or '' }}">
    </label>
    <div class="row-actions" style="justify-content: flex-start; margin-top: 6px;">
      <button type="submit" class="btn btn-primary">Enregistrer</button>
      <a href="{{ url_for('library.' ~ cfg.url) }}" class="btn btn-secondary">Annuler</a>
    </div>
  </form>
</section>
{% endblock %}
