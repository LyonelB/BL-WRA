<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ station_name }}{% endblock %} — Admin</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="layout">
    <nav class="sidebar">
      <div class="brand">
        <span class="brand-dot"></span>
        <span>{{ station_name }}</span>
      </div>
      <a href="{{ url_for('dashboard.index') }}" class="{{ 'active' if request.endpoint == 'dashboard.index' }}">Tableau de bord</a>
      <a href="{{ url_for('library.bibliotheque') }}" class="{{ 'active' if request.endpoint and request.endpoint.startswith('library.bibliotheque') }}">Bibliothèque</a>
      <a href="{{ url_for('playlists.index') }}" class="{{ 'active' if request.endpoint and request.endpoint.startswith('playlists.') }}">Playlists</a>
      <a href="{{ url_for('library.jingles') }}" class="{{ 'active' if request.endpoint and request.endpoint.startswith('library.jingles') }}">Jingles</a>
      <a href="{{ url_for('library.pubs') }}" class="{{ 'active' if request.endpoint and (request.endpoint.startswith('library.pubs') or request.endpoint.startswith('pub_slots.') or request.endpoint.startswith('pub_campaigns.')) }}">Pubs</a>
      <a href="{{ url_for('settings.reglages') }}" class="{{ 'active' if request.endpoint == 'settings.reglages' }}">Réglages</a>
      <a href="{{ url_for('logs.logs_page') }}" class="{{ 'active' if request.endpoint and request.endpoint.startswith('logs.') }}">Logs</a>
      <div class="sidebar-footer">
        <a href="{{ url_for('auth.compte') }}" class="{{ 'active' if request.endpoint == 'auth.compte' }}">{{ session.get('username') }}</a>
        <a href="{{ url_for('auth.logout') }}">Se déconnecter</a>
      </div>
    </nav>
    <main class="content">
      {% include "_flash.html" %}
      {% block content %}{% endblock %}
    </main>
  </div>

  <dialog id="modal-editor" class="modal-editor">
    <button type="button" class="modal-close" onclick="closeEditModal()" aria-label="Fermer">&times;</button>
    <div id="modal-editor-body"></div>
  </dialog>

  <script>
    // Pop-up de modification (page Modifier -> Bibliotheque/Creneaux/
    // Planification/Playlists/Serveurs externes) : au lieu de naviguer vers
    // la page d'edition (et devoir faire "precedent" pour revenir), on la
    // charge en arriere-plan et on l'affiche dans une <dialog> avec une
    // croix pour la fermer. Chaque vue de modification cote Flask sait
    // rendre soit la page complete (acces direct/JS desactive), soit juste
    // le fragment de contenu (parametre ?modal=1, voir _modal_base.html) -
    // c'est ce fragment qui est injecte ici.
    function openEditModal(url) {
      var dialog = document.getElementById('modal-editor');
      var body = document.getElementById('modal-editor-body');
      var sep = url.indexOf('?') === -1 ? '?' : '&';
      fetch(url + sep + 'modal=1', { headers: { 'X-Requested-With': 'XMLHttpRequest' } })
        .then(function (resp) {
          // Si la vue a redirige (ex. element supprime entre-temps), le
          // fragment attendu n'existe plus : on navigue normalement plutot
          // que d'injecter une page complete dans le pop-up.
          if (resp.redirected) {
            window.location = resp.url;
            return null;
          }
          if (!resp.ok) {
            window.location = url;
            return null;
          }
          return resp.text();
        })
        .then(function (html) {
          if (html === null) return;
          body.innerHTML = html;
          dialog.showModal();
        })
        .catch(function () {
          // Repli si le pop-up echoue pour une raison ou une autre (reseau,
          // session expiree...) : comportement d'avant, navigation directe.
          window.location = url;
        });
    }

    function closeEditModal() {
      var dialog = document.getElementById('modal-editor');
      if (dialog && dialog.open) dialog.close();
    }

    // Un clic sur le fond assombri (en dehors de la boite elle-meme) ferme
    // aussi le pop-up, comme la croix ou la touche Echap (native a <dialog>).
    document.addEventListener('DOMContentLoaded', function () {
      var dialog = document.getElementById('modal-editor');
      if (!dialog) return;
      dialog.addEventListener('click', function (event) {
        if (event.target === dialog) closeEditModal();
      });
    });

    // Utilise par le lien "Annuler" de chaque formulaire d'edition : ferme
    // le pop-up s'il est ouvert (et annule la navigation du lien), sinon
    // laisse le lien naviguer normalement (acces direct a la page, sans
    // pop-up - repli complet).
    function closeEditModalIfOpen() {
      var dialog = document.getElementById('modal-editor');
      if (dialog && dialog.open) {
        dialog.close();
        return true;
      }
      return false;
    }
  </script>
</body>
</html>
