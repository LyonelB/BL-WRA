{% extends "_modal_base.html" if modal else "base.html" %}
{% block title %}Modifier — créneau{% endblock %}
{% block content %}

<div class="page-header">
  <h1>Modifier le créneau</h1>
</div>

<section class="card" style="max-width: 420px;">
  <form method="post" class="settings-form">
    <label>Heure
      <input type="time" name="time" value="{{ slot.time }}" required>
    </label>
    <label>Jours de diffusion
      <div class="days-picker">
        {% set slot_days = slot.days.split(",") %}
        {% for value, label in [("1","Lun"),("2","Mar"),("3","Mer"),("4","Jeu"),("5","Ven"),("6","Sam"),("7","Dim")] %}
        <label class="checkbox-list-item">
          <input type="checkbox" name="days" value="{{ value }}" {{ "checked" if value in slot_days else "" }}>
          {{ label }}
        </label>
        {% endfor %}
      </div>
    </label>
    <div class="row-actions" style="justify-content: flex-start; margin-top: 6px;">
      <button type="submit" class="btn btn-primary">Enregistrer</button>
      <a href="{{ url_for('library.pubs') }}" class="btn btn-secondary" onclick="return !closeEditModalIfOpen()">Annuler</a>
    </div>
  </form>
</section>
{% endblock %}
